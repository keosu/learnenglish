name: Daily news and Pages

on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      generate:
        description: Generate today's lessons before deploying
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate lessons with free models
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate)
        continue-on-error: true
        timeout-minutes: 40
        run: node scripts/news.mjs

      - name: Commit lessons
        if: github.event_name != 'push'
        run: |
          git config user.name "echo-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news
          if git diff --cached --quiet; then
            echo "No new lessons"
          else
            git commit -m "news: $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - run: npm test

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
